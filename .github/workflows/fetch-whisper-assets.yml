name: fetch-whisper-assets

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fetch-whisper-assets.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fetch optimized Whisper Linux binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          curl -L --retry 5 --retry-all-errors --fail --show-error \
            -o /tmp/whisper-bin.tar.gz \
            https://github.com/ggml-org/whisper.cpp/releases/download/v1.9.2/whisper-bin-ubuntu-x64.tar.gz
          tar -xzf /tmp/whisper-bin.tar.gz -C out
          find out -type f -maxdepth 4 -print0 | sort -z | xargs -0 sha256sum > out/SHA256SUMS.txt
          find out -maxdepth 4 -type f -printf '%p %s bytes\n'
      - name: Upload assets
        uses: actions/upload-artifact@v4
        with:
          name: whisper-bin-ubuntu-x64
          path: out/
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
