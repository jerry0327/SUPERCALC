name: Temporary Three.js Transfer

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-three-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24

      - name: Download and bundle official Three.js 0.185.1
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work vendor
          cd work
          npm init -y >/dev/null
          npm install --save-exact three@0.185.1 esbuild@0.25.6 >/dev/null
          cat > entry.mjs <<'EOF'
          import * as THREE from 'three';
          globalThis.THREE = THREE;
          EOF
          ./node_modules/.bin/esbuild entry.mjs \
            --bundle \
            --minify \
            --format=iife \
            --target=es2020 \
            --legal-comments=inline \
            --outfile=../vendor/three-r185.iife.min.js
          cp node_modules/three/LICENSE ../vendor/THREE-LICENSE.txt
          cp node_modules/three/package.json ../vendor/three-package.json
          cp node_modules/three/build/three.module.min.js ../vendor/three.module.min.js
          cp node_modules/three/build/three.core.min.js ../vendor/three.core.min.js
          cd ..
          grep -q '185' vendor/three-r185.iife.min.js
          sha256sum vendor/* > vendor/SHA256SUMS.txt
          wc -c vendor/*

      - name: Upload Three.js artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: three-r185-official-bundle
          path: vendor/
          if-no-files-found: error
          retention-days: 1
