name: Precision Model Fetch

on:
  push:
    paths:
      - '.github/workflows/precision-model-fetch.yml'

permissions:
  contents: read

jobs:
  build-model:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download and reassemble verified Whisper small Q5_1
        shell: bash
        run: |
          set -euo pipefail
          mkdir parts
          for suffix in aa ab ac ad ae af ag ah ai aj; do
            curl -L --fail --retry 5 --retry-delay 2 \
              -o "parts/ggml-small-q5_1.bin.part-${suffix}" \
              "https://raw.githubusercontent.com/advexplorer/whisper/main/ggml-small-q5_1.bin.part-${suffix}"
          done
          cat parts/ggml-small-q5_1.bin.part-* > ggml-small-q5_1.bin
          echo 'ae85e4a935d7a567bd102fe55afc16bb595bdb618e11b2fc7591bc08120411bb  ggml-small-q5_1.bin' | sha256sum -c -
      - name: Upload verified model
        uses: actions/upload-artifact@v4
        with:
          name: ggml-small-q5_1
          path: ggml-small-q5_1.bin
          compression-level: 0
          retention-days: 1
